<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styling.css">
    <title>GSIL | Admin Login</title>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><span class="GS">GSIL</span> Portal</h1>
                <p>Enter your credentials to access the dashboard</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Staff Email</label>
                    <input type="email" id="email" placeholder="admin@gsil.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span id="toggle-password" class="eye-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <button type="submit" class="primary-btn login-btn">Login to Dashboard</button>
            </form>
            
            <div class="login-footer">
                <a href="index.html">← Back to Tracking</a>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
