<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Tracking page">
    <link rel="stylesheet" href="styling.css">

    <title>Tracking page</title>

<body>
    <div class="trackingPage">
        

        <div class="content-wrapper">
        <form action="" id="track-form">
            <label for="track" id="track">Track your Shipment</label>
            <div class="input-div">
                <input type="text" id="Number" placeholder="E.g 123456789">
                <button type="submit" id="track-btn">Track</button>
            </div>
        </form>
        <div id="map-hero" class="hidden"></div>

    <div id="tracking-results" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="text/javascript" src="js/app2.js"></script>
